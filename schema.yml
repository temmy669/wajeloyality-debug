components:
  schemas:
    NameEnum:
      enum:
      - admin
      - accountant
      - auditor
      - manager
      type: string
      description: |-
        * `admin` - Admin
        * `accountant` - Accountant
        * `auditor` - Auditor
        * `manager` - Manager
    PaginatedRoleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PaginatedmerchantUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/merchantUser'
    PatchedRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          $ref: '#/components/schemas/NameEnum'
    PatchedmerchantUser:
      type: object
      description: Serializer to map the Model instance into JSON format.
      properties:
        username:
          type: string
          maxLength: 45
        name:
          type: string
          nullable: true
          maxLength: 45
        branchID:
          type: integer
        merchID:
          type: integer
        role:
          type: integer
          nullable: true
    Role:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          $ref: '#/components/schemas/NameEnum'
      required:
      - id
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    merchantUser:
      type: object
      description: Serializer to map the Model instance into JSON format.
      properties:
        username:
          type: string
          maxLength: 45
        name:
          type: string
          nullable: true
          maxLength: 45
        branchID:
          type: integer
        merchID:
          type: integer
        role:
          type: integer
          nullable: true
      required:
      - branchID
      - merchID
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
