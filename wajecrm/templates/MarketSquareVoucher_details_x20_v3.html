<!DOCTYPE html>
<html>
    <head>
        <link href="https://fonts.googleapis.com/css?family=Roboto:400,400i,700,700i" rel="stylesheet">

        <style type="text/css">
            body {
                width: 100%;
                font-family: roboto, 'helvetica neue', helvetica, arial, sans-serif;
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
            }
        </style>
    </head>

    <body style="padding: 0; margin: 0;">
        
        <div style="padding: 0px; margin: 0; width: 145pt;float:left; padding:6pt 17px; border:1px solid #f2f2f2; page-break-inside: avoid;">

            <!-- top banner area -->
            <table cellpadding="0" cellspacing="0">
                <tbody>
                    <tr>
                        <td class="esd-stripe" align="center">
                            <img class="adapt-img" src="https://fheyno.stripocdn.email/content/guids/CABINET_e9e90f5a8b73fe558f9bad91da77fc9b/images/97921605859747133.png" style="display: block; width: 145pt;">
                        </td>
                    </tr>
                </tbody>
            </table>


            <!-- middle card voucher name. -->
            <table cellpadding="0" cellspacing="0" align="center" style="display: block; width: 145pt;">
                <tbody>
                    <tr>
                        <td style="display: block; width: 140pt;" align="center">
                            <span style="color: #000066; font-size: 10pt; font-family: roboto, 'helvetica neue', helvetica, arial, sans-serif;margin:2pt">
                                {{beneficiary}} 
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>


            <!-- Voucher number no -->
            <table cellpadding="0" cellspacing="0" align="center" style="background-color: 04065b;width: 145pt;">
                <tbody>
                    <tr>
                        <td class="esd-stripe" align="center" bgcolor="#04065b" style="display: block; width: 145pt;">
                            <span style="color: #ffffff; font-size: 12pt;">
                                <strong>
                                    <small>Voucher No</small> <br> 
                                    {{code}}
                                </strong>
                            </span>
                            <br>
                            <span style="color: #ffffff; font-size: 12pt;">
                                <strong>&#x20a6; {{amount}}</strong>
                            </span>
                            <br>
                            {% comment %} <span style="color: #ffffff; font-size: 12pt;">
                                <strong>Expiry date: {{date}}</strong>
                            </span> {% endcomment %}
                            <span style="color: #ffffff; font-size: 6pt;">
                                <strong>
                                    <small>Expiration Date</small> <br> 
                                    {{expiry}}
                                </strong>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- footer area -->
            <table cellpadding="0" cellspacing="0" class="es-content esd-footer-popover" align="center" style="width: 145pt;">
                <tbody>
                    <tr>
                        <td class="esd-stripe" align="center">
                            <img class="adapt-img" src="https://fheyno.stripocdn.email/content/guids/CABINET_e9e90f5a8b73fe558f9bad91da77fc9b/images/53311605610988036.png" style="display: block; width: 145pt;">
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>

</html>
