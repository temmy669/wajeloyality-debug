<!DOCTYPE html>
<html lang="en-GB">

<head>
	<meta content="email=no" name="format-detection">
	<meta content="date=no" name="format-detection">
	<style>
		.awl a {
			color: #FFFFFF;
			text-decoration: none;
		}

		.abml a {
			color: #000000;
			font-family: Roboto-Medium, Helvetica, Arial, sans-serif;
			font-weight: bold;
			text-decoration: none;
		}

		.adgl a {
			color: rgba(0, 0, 0, 0.87);
			text-decoration: none;
		}

		.afal a {
			color: #b0b0b0;
			text-decoration: none;
		}

		@media screen and (min-width: 600px) {
			.v2sp {
				padding: 6px 30px 0px;
			}

			.v2rsp {
				padding: 0px 10px;
			}
		}

		@media screen and (min-width: 600px) {
			.mdv2rw {
				padding: 40px 40px;
			}
		}
	</style>
	<link href="//fonts.googleapis.com/css?family=Google+Sans" rel=stylesheet type="text/css">
	<link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
	<title>Voucher Details </title>
</head>

<body bgcolor="#FFFFFF" style="margin: 0; padding: 0;">
	<table border=0 cellpadding=0 cellspacing=0 height="100%" lang="en-GB" style="min-width: 348px;" width="100%">
		<Tbody>
			<tr style="height: 32px;">
				<td></td>
			</tr>
			<tr align=center>
				<td>
					<table border=0 cellpadding=0 cellspacing=0 style="padding-bottom: 20px;max-width: 516px;min-width: 220px;">
						<Tbody>
							<tr>
								<td style="width: 8px;" width=8></td>
								<td>
									<div align=center class=mdv2rw style="border-style: solid; border-width: thin; border-color:#dadce0; border-radius: 8px; padding: 40px 20px;">
										<div style="height: 80px; width: 80px;padding-bottom: 20px;border-bottom: thin solid #dadce0;">
											<img src="{{logo}}">
										</div>
										<div style="font-family: Google Sans, Roboto, RobotoDraft, Helvetica, Arial, sans-serif;color: rgba(0,0,0,0.87); line-height: 32px; padding-bottom: 24px;text-align: center; word-break: break-word;">
											<img src="{{barcode}}" style="height: 80px; width: 120px;">

											<div style="font-size: 24px;">Your {{merchantname}} Gift Card code</div>
										</div>

										<div style="font-size: 20px;">Dear {{user}},</div>
										<p style="border-bottom: thin solid #dadce0;padding-bottom: 24px;font-size: 20px;font-family: 'Orbitron', sans-serif; font-weight: medium;">Beneficiary
											Name:{{beneficiary}} </p>
										<p style="border-bottom: thin solid #dadce0;padding-bottom: 24px;font-size: 20px;font-family: 'Orbitron', sans-serif; font-weight: medium;">Your
											voucher serial number is {{code}} and the gift card value is {{amount}}</p>
									</div>
									<div style="text-align: left;">
										<div style="font-family: Roboto-Regular,Helvetica,Arial,sans-serif;color: rgba(0,0,0,0.54);font-size: 11px; line-height: 18px; padding-top: 12px; text-align: center;">
											<div style="direction: ltr;">&copy; 2019 Waje Smart Solutions, <a class=afal style="font-family: Roboto-Regular,Helvetica,Arial,sans-serif;color: rgba(0,0,0,0.54);font-size: 11px; line-height: 18px; padding-top: 12px; text-align: center;">35E
													Agungi-Ajiran, Lekki, Lagos State.</a></div>
										</div>
									</div>
								</td>
								<td style="width: 8px;" width=8></td>
							</tr>
						</Tbody>
					</table>
				</td>
			</tr>
			<tr height=32 style="height: 32px;">
				<td></td>
			</tr>
		</Tbody>
	</table>
</body>

</html>
