name: Publish APP to Testserver Cpanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Use Node.js 14
        uses: actions/setup-node@v2
        with:
          node-version: '14'
          
      - name: Install Dependencies
        run: npm install

      - name: 🔨 Build Project
        run: CI=false npm run build
       
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ftp.marketsquareng.website
          username: backend@wajeloyalityapi.marketsquareng.website
          password: $h~nc3iiBGza
          protocol: ftp
          port: 21
          local-dir: dist/
          dry-run: false
        

